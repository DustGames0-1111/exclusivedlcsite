<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="extra-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="extra-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="extra-cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#0c6962"/>
    </linearGradient>
    <linearGradient id="extra-cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c6962"/>
      <stop offset="100%" stop-color="#074540"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="extra-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#38ef7d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b1715"/>
  <circle cx="50" cy="50" r="44" fill="url(#extra-glow)"/>
  <g filter="url(#extra-shadow)" transform="translate(46, 46)">
    <!-- Isometric Cube -->
    <polygon points="0,-24 24,-10 0,4 -24,-10" fill="url(#extra-cube-top)"/>
    <polygon points="-24,-10 0,4 0,32 -24,18" fill="url(#extra-cube-left)"/>
    <polygon points="0,4 24,-10 24,18 0,32" fill="url(#extra-cube-right)"/>
    <text x="-2" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Na</text>
  </g>
  <!-- Plus / Star Badge in top right corner -->
  <g transform="translate(68, 28)">
    <circle cx="0" cy="0" r="14" fill="#0b1715"/>
    <circle cx="0" cy="0" r="12" fill="url(#badge-grad)"/>
    <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
