<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sod-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sod-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sod-cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sod-cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="sod-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b1411"/>
  <circle cx="50" cy="50" r="44" fill="url(#sod-glow)"/>
  <g filter="url(#sod-shadow)" transform="translate(50, 48)">
    <!-- Isometric Cube -->
    <!-- Top Face -->
    <polygon points="0,-26 26,-11 0,4 -26,-11" fill="url(#sod-cube-top)"/>
    <!-- Left Face -->
    <polygon points="-26,-11 0,4 0,34 -26,19" fill="url(#sod-cube-left)"/>
    <!-- Right Face -->
    <polygon points="0,4 26,-11 26,19 0,34" fill="url(#sod-cube-right)"/>
    <!-- Chemical Symbol Na overlay with glow -->
    <text x="-1" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Na</text>
  </g>
</svg>
